name: Extension CI

on:
  pull_request:
    paths: &extension-paths
      - 'apps/extension/**'
      - 'README*.md'
      - '.portfolio/**'
      - '.github/workflows/ext-test.yml'
  push:
    branches: [main]
    paths: *extension-paths

permissions:
  contents: read

jobs:
  test:
    name: Test and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/extension
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/extension/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Build Chromium, Edge and Firefox
        run: |
          npm run build
          npm run build:edge
          npm run build:firefox
